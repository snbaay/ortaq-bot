# Бот хабарламалары
bot.start.greeting=Сәлем! Мен пәтерде бірге тұратын достардың ортақ шығындарын есептейтін ботпын. Кім қанша жұмсағанын және кім кімге қарыз екенін жазып отырамын. Командаларды көру үшін /komek жаз!
bot.komek.text=Командалар:\n\
/start — бастау\n\
/komek — көмек\n\
/shygyn 630 су — шығын қосу (немесе жай ғана "630 су")\n\
/shygyn 3000 пицца @user1 @user2 — аталған адамдарға және төлеушіге бөлу\n\
/balans — әркімнің балансы\n\
/qaryz — кім кімге қанша қарыз\n\
/tolem Асан 500 — қарызды қайтару\n\
/tarih — соңғы шығындар\n\
/oshiru — соңғы жазбаңды өшіру (немесе /oshiru <id>)\n\
/esep — айлық есеп\n\
/kezek — бүгінгі кезек пен апталық кесте\n\
/kezek_qoyu дүйсенбі @user1 @user2 — күннің кезегін белгілеу (бірнеше жол жазуға болады, демалыс үшін -)\n\
/kezek_tazalau — кестені тазалау\n\
/otkizu @user — бүгінгі кезегіңді беру\n\
/dayyn — ас дайын хабарламасы\n\
/tizim — сатып алу тізімі\n\
/satyp 1 — сатып алынды деп белгілеу\n\
/jazba — ортақ жазбалар\n\
/jazba_oshiru 1 — жазбаны жою\n\
/is — атқарылған істі жазу\n\
/ister — істер тізімі\n\
/songy сүзгі — соңғы рет қашан жасалды\n\
/merzim — төлем мерзімдері\n\
/merzim_qosu 5 150000 Жалдау — жаңа мерзім\n\
/merzim_oshiru 1 — мерзімді жою\n\
/kim кім қоқыс шығарады — кездейсоқ адам\n\
/tandau пицца, бургер — таңдау\n\
/tiyn — тиын лақтыру

